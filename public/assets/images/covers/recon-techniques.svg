<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 675" width="1200" height="675" style="background-color: #F0FDFA;">
  <defs>
    <linearGradient id="bgGrad_recon_techniques" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0FDFA" />
      <stop offset="50%" stop-color="#CCFBF1" />
      <stop offset="100%" stop-color="#99F6E4" />
    </linearGradient>

    <linearGradient id="accentGrad_recon_techniques" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488" />
      <stop offset="100%" stop-color="#2DD4BF" />
    </linearGradient>

    <pattern id="dotGrid_recon_techniques" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.2" fill="#94A3B8" opacity="0.22" />
    </pattern>

    <radialGradient id="glow1_recon_techniques" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5EEAD4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#5EEAD4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2_recon_techniques" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#99F6E4" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#99F6E4" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 背景底图与极简点阵 -->
  <rect width="100%" height="100%" fill="url(#bgGrad_recon_techniques)" />
  <rect width="100%" height="100%" fill="url(#dotGrid_recon_techniques)" />

  <!-- 柔和浅色高质感弥散光斑 -->
  <circle cx="960" cy="180" r="380" fill="url(#glow1_recon_techniques)" />
  <circle cx="280" cy="520" r="320" fill="url(#glow2_recon_techniques)" />

  <!-- 主题构图图腾 -->
  
        <g transform="translate(630, 100) scale(1.4)" opacity="0.85">
          <circle cx="150" cy="150" r="130" fill="none" stroke="#0D9488" stroke-width="2" opacity="0.3" />
          <circle cx="150" cy="150" r="85" fill="none" stroke="#0D9488" stroke-width="2" opacity="0.5" />
          <path d="M 150 150 L 260 70 A 130 130 0 0 0 150 20 Z" fill="#0D9488" opacity="0.15" />
          <line x1="150" y1="150" x2="260" y2="70" stroke="#0D9488" stroke-width="2.5" />
          <circle cx="210" cy="100" r="6" fill="#0D9488" />
          <circle cx="120" cy="90" r="4" fill="#0D9488" opacity="0.7" />
          <circle cx="180" cy="200" r="8" fill="#0D9488" opacity="0.8" />
        </g>
      

  <!-- 极简渐变底边线条 -->
  <rect x="90" y="540" width="1020" height="2" fill="url(#accentGrad_recon_techniques)" opacity="0.35" rx="1" />

  <!-- 极简 Pill 领域标签 -->
  <g transform="translate(95, 100)">
    <rect x="0" y="0" width="270" height="36" rx="18" fill="#CCFBF1" opacity="0.95" />
    <text x="135" y="23" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#0F766E" letter-spacing="1.5">
      RECONNAISSANCE & OSINT
    </text>
  </g>

  <!-- 右下角 Logo/落款 -->
  <g transform="translate(1100, 580)">
    <text text-anchor="end" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#64748B" letter-spacing="2">
      FLYING THEME · 序栈
    </text>
  </g>
</svg>