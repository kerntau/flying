<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2" />
      <stop offset="50%" stop-color="#FEE2E2" />
      <stop offset="100%" stop-color="#FCA5A5" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.2" fill="#94A3B8" opacity="0.22" />
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90" result="blur" />
    </filter>
  </defs>

  <!-- 背景底图与极简点阵 -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#dotGrid)" />

  <!-- 柔和浅色高质感弥散光斑 -->
  <circle cx="960" cy="180" r="320" fill="#F87171" opacity="0.28" filter="url(#softGlow)" />
  <circle cx="280" cy="520" r="260" fill="#FCA5A5" opacity="0.22" filter="url(#softGlow)" />

  <!-- 主题构图图腾 -->
  
        <g transform="translate(780, 150)" opacity="0.85">
          <path d="M 150 30 L 250 70 V 160 C 250 230, 150 280, 150 280 C 150 280, 50 230, 50 160 V 70 Z" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.5" />
          <path d="M 150 200 V 100 M 120 130 L 150 100 L 180 130" fill="none" stroke="#DC2626" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
        </g>
      

  <!-- 极简渐变底边线条 -->
  <rect x="90" y="540" width="1020" height="2" fill="url(#accentGrad)" opacity="0.35" rx="1" />

  <!-- 文本内容排版 -->
  <g transform="translate(95, 230)">
    <!-- Pill 标签 -->
    <rect x="0" y="0" width="202.5" height="32" rx="16" fill="#FEE2E2" opacity="0.95" />
    <text x="101.25" y="20.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#B91C1C" letter-spacing="1.2">
      WINDOWS ELEVATION
    </text>

    <!-- 主标题 -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
      Windows 提权技术解析
    </text>

    <!-- 副标题 -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="500" fill="#475569" letter-spacing="0.2">
      UAC 绕过 · 令牌窃取与服务路径劫持
    </text>
  </g>

  <!-- 右下角 Logo/落款 -->
  <g transform="translate(1100, 580)">
    <text text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#64748B" letter-spacing="2">
      FLYING THEME · 序栈
    </text>
  </g>
</svg>