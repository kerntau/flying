<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 675" width="1200" height="675" style="background-color: #F7FEE7;">
  <defs>
    <linearGradient id="bgGrad_sorting_algorithms_comparison" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7FEE7" />
      <stop offset="50%" stop-color="#ECFCCB" />
      <stop offset="100%" stop-color="#D9F99D" />
    </linearGradient>

    <linearGradient id="accentGrad_sorting_algorithms_comparison" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#65A30D" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>

    <pattern id="dotGrid_sorting_algorithms_comparison" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.2" fill="#94A3B8" opacity="0.22" />
    </pattern>

    <radialGradient id="glow1_sorting_algorithms_comparison" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A3E635" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#A3E635" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2_sorting_algorithms_comparison" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#BEF264" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#BEF264" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 背景底图与极简点阵 -->
  <rect width="100%" height="100%" fill="url(#bgGrad_sorting_algorithms_comparison)" />
  <rect width="100%" height="100%" fill="url(#dotGrid_sorting_algorithms_comparison)" />

  <!-- 柔和浅色高质感弥散光斑 -->
  <circle cx="960" cy="180" r="380" fill="url(#glow1_sorting_algorithms_comparison)" />
  <circle cx="280" cy="520" r="320" fill="url(#glow2_sorting_algorithms_comparison)" />

  <!-- 主题构图图腾 -->
  
        <g transform="translate(770, 160)" opacity="0.85">
          <rect x="20" y="180" width="36" height="100" rx="6" fill="#65A30D" opacity="0.3" />
          <rect x="70" y="120" width="36" height="160" rx="6" fill="#65A30D" opacity="0.5" />
          <rect x="120" y="60" width="36" height="220" rx="6" fill="#65A30D" />
          <rect x="170" y="140" width="36" height="140" rx="6" fill="#65A30D" opacity="0.6" />
          <rect x="220" y="90" width="36" height="190" rx="6" fill="#65A30D" opacity="0.8" />
          <path d="M 38 170 C 88 100, 138 40, 238 80" fill="none" stroke="#65A30D" stroke-width="3" stroke-dasharray="6 4" />
        </g>
      

  <!-- 极简渐变底边线条 -->
  <rect x="90" y="540" width="1020" height="2" fill="url(#accentGrad_sorting_algorithms_comparison)" opacity="0.35" rx="1" />

  <!-- 文本内容排版 -->
  <g transform="translate(95, 230)">
    <!-- Pill 标签 -->
    <rect x="0" y="0" width="181.5" height="32" rx="16" fill="#ECFCCB" opacity="0.95" />
    <text x="90.75" y="20.5" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="800" fill="#4D7C0F" letter-spacing="1.2">
      DATA STRUCTURES
    </text>

    <!-- 主标题 -->
    <text x="0" y="85" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="42" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
      十大排序算法性能对比
    </text>

    <!-- 副标题 -->
    <text x="0" y="132" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="500" fill="#475569" letter-spacing="0.2">
      时间复杂度 · 空间开销与稳定性深度分析
    </text>
  </g>

  <!-- 右下角 Logo/落款 -->
  <g transform="translate(1100, 580)">
    <text text-anchor="end" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#64748B" letter-spacing="2">
      FLYING THEME · 序栈
    </text>
  </g>
</svg>