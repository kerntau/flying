<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background-color: #F8FAFC;">
  <defs>
    <linearGradient id="bgGrad_graph_algorithms" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#F0F9FF" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <linearGradient id="accentGrad_graph_algorithms" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <pattern id="dotGrid_graph_algorithms" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.2" fill="#94A3B8" opacity="0.22" />
    </pattern>

    <filter id="softGlow_graph_algorithms" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- 背景底图与极简点阵 -->
  <rect width="100%" height="100%" fill="url(#bgGrad_graph_algorithms)" />
  <rect width="100%" height="100%" fill="url(#dotGrid_graph_algorithms)" />

  <!-- 柔和浅色高质感弥散光斑 -->
  <circle cx="960" cy="180" r="320" fill="#38BDF8" opacity="0.28" filter="url(#softGlow_graph_algorithms)" />
  <circle cx="280" cy="520" r="260" fill="#7DD3FC" opacity="0.22" filter="url(#softGlow_graph_algorithms)" />

  <!-- 主题构图图腾 -->
  
        <g transform="translate(760, 150)" opacity="0.85">
          <line x1="80" y1="80" x2="240" y2="60" stroke="#0284C7" stroke-width="2" opacity="0.4" />
          <line x1="80" y1="80" x2="160" y2="200" stroke="#0284C7" stroke-width="2" opacity="0.4" />
          <line x1="240" y1="60" x2="260" y2="220" stroke="#0284C7" stroke-width="2" opacity="0.4" />
          <line x1="160" y1="200" x2="260" y2="220" stroke="#0284C7" stroke-width="2" opacity="0.4" />
          <line x1="160" y1="200" x2="60" y2="260" stroke="#0284C7" stroke-width="2" opacity="0.4" />
          <circle cx="80" cy="80" r="28" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" />
          <circle cx="240" cy="60" r="22" fill="#0284C7" />
          <circle cx="160" cy="200" r="34" fill="#FFFFFF" stroke="#0284C7" stroke-width="3" />
          <circle cx="160" cy="200" r="14" fill="#0284C7" />
          <circle cx="260" cy="220" r="20" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
          <circle cx="60" cy="260" r="24" fill="#0284C7" opacity="0.7" />
        </g>
      

  <!-- 极简渐变底边线条 -->
  <rect x="90" y="540" width="1020" height="2" fill="url(#accentGrad_graph_algorithms)" opacity="0.35" rx="1" />

  <!-- 文本内容排版 -->
  <g transform="translate(95, 230)">
    <!-- Pill 标签 -->
    <rect x="0" y="0" width="150" height="32" rx="16" fill="#E0F2FE" opacity="0.95" />
    <text x="75" y="20.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#0369A1" letter-spacing="1.2">
      GRAPH THEORY
    </text>

    <!-- 主标题 -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
      图算法全景解析
    </text>

    <!-- 副标题 -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="500" fill="#475569" letter-spacing="0.2">
      从广度优先搜索到最短路径与最小生成树
    </text>
  </g>

  <!-- 右下角 Logo/落款 -->
  <g transform="translate(1100, 580)">
    <text text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#64748B" letter-spacing="2">
      FLYING THEME · 序栈
    </text>
  </g>
</svg>