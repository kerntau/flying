<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 675" width="1200" height="675" style="background-color: #F8FAFC;">
  <defs>
    <linearGradient id="bgGrad_ai_analysis_2026" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#EEF2FF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <linearGradient id="accentGrad_ai_analysis_2026" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <pattern id="dotGrid_ai_analysis_2026" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.2" fill="#94A3B8" opacity="0.22" />
    </pattern>

    <radialGradient id="glow1_ai_analysis_2026" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2_ai_analysis_2026" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 背景底图与极简点阵 -->
  <rect width="100%" height="100%" fill="url(#bgGrad_ai_analysis_2026)" />
  <rect width="100%" height="100%" fill="url(#dotGrid_ai_analysis_2026)" />

  <!-- 柔和浅色高质感弥散光斑 -->
  <circle cx="960" cy="180" r="380" fill="url(#glow1_ai_analysis_2026)" />
  <circle cx="280" cy="520" r="320" fill="url(#glow2_ai_analysis_2026)" />

  <!-- 主题构图图腾 -->
  
        <g transform="translate(620, 110) scale(1.4)" opacity="0.85">
          <circle cx="160" cy="160" r="140" fill="none" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6 6" />
          <circle cx="160" cy="160" r="95" fill="none" stroke="#4F46E5" stroke-width="1.5" opacity="0.4" />
          <circle cx="160" cy="160" r="45" fill="#FFFFFF" stroke="#4F46E5" stroke-width="3" />
          <circle cx="160" cy="160" r="14" fill="#4F46E5" />
          <line x1="160" y1="20" x2="160" y2="300" stroke="#4F46E5" stroke-width="1.5" opacity="0.3" />
          <line x1="20" y1="160" x2="300" y2="160" stroke="#4F46E5" stroke-width="1.5" opacity="0.3" />
          <circle cx="160" cy="20" r="6" fill="#4F46E5" />
          <circle cx="300" cy="160" r="6" fill="#4F46E5" />
          <circle cx="160" cy="300" r="6" fill="#4F46E5" />
          <circle cx="20" cy="160" r="6" fill="#4F46E5" />
        </g>
      

  <!-- 极简渐变底边线条 -->
  <rect x="90" y="540" width="1020" height="2" fill="url(#accentGrad_ai_analysis_2026)" opacity="0.35" rx="1" />

  <!-- 极简 Pill 领域标签 -->
  <g transform="translate(95, 100)">
    <rect x="0" y="0" width="270" height="36" rx="18" fill="#E0E7FF" opacity="0.95" />
    <text x="135" y="23" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#4338CA" letter-spacing="1.5">
      AI &amp;amp; DEEP LEARNING
    </text>
  </g>

  <!-- 右下角 Logo/落款 -->
  <g transform="translate(1100, 580)">
    <text text-anchor="end" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#64748B" letter-spacing="2">
      FLYING THEME · 序栈
    </text>
  </g>
