<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- 背景底图与网格纹理 -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- 科技半透明发光光束 -->
  <circle cx="950" cy="150" r="280" fill="#6366f1" opacity="0.28" filter="url(#glow)" />
  <circle cx="200" cy="550" r="220" fill="#a855f7" opacity="0.2" filter="url(#glow)" />

  <!-- 背景几何构图图形 -->
  <g opacity="0.12" transform="translate(680, 80)">
    <rect x="0" y="0" width="400" height="400" rx="32" fill="none" stroke="#6366f1" stroke-width="4" transform="rotate(15 200 200)"/>
    <circle cx="200" cy="200" r="140" fill="none" stroke="#a855f7" stroke-width="3" stroke-dasharray="12 12" />
    <circle cx="200" cy="200" r="80" fill="#6366f1" />
  </g>

  <!-- 中央主标题文字 -->
  <g transform="translate(90, 260)">
    <text font-family="-apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="52" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
      <tspan x="0" y="0">2026 国内外 AI</tspan>
      <tspan x="0" y="70">大模型发展态势深度分析</tspan>
    </text>
  </g>

  <!-- 底部渐变分割线 -->
  <rect x="90" y="520" width="1020" height="2" fill="url(#accentGrad)" opacity="0.8" />

  <!-- 右下角落款 -->
  <g transform="translate(1110, 565)">
    <text text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="rgba(255, 255, 255, 0.6)" letter-spacing="2">
      FLYING THEME · 序栈
    </text>
  </g>
</svg>