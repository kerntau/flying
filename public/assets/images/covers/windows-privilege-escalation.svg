<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 675" width="1200" height="675" style="background-color: #FEF2F2;">
  <defs>
    <linearGradient id="bgGrad_windows_privilege_escalation" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF2F2" />
      <stop offset="50%" stop-color="#FEE2E2" />
      <stop offset="100%" stop-color="#FCA5A5" />
    </linearGradient>

    <linearGradient id="accentGrad_windows_privilege_escalation" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC2626" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <pattern id="dotGrid_windows_privilege_escalation" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.2" fill="#94A3B8" opacity="0.22" />
    </pattern>

    <radialGradient id="glow1_windows_privilege_escalation" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F87171" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#F87171" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2_windows_privilege_escalation" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCA5A5" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FCA5A5" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 背景底图与极简点阵 -->
  <rect width="100%" height="100%" fill="url(#bgGrad_windows_privilege_escalation)" />
  <rect width="100%" height="100%" fill="url(#dotGrid_windows_privilege_escalation)" />

  <!-- 柔和浅色高质感弥散光斑 -->
  <circle cx="960" cy="180" r="380" fill="url(#glow1_windows_privilege_escalation)" />
  <circle cx="280" cy="520" r="320" fill="url(#glow2_windows_privilege_escalation)" />

  <!-- 主题构图图腾 -->
  
        <g transform="translate(640, 100) scale(1.4)" opacity="0.85">
          <path d="M 150 30 L 250 70 V 160 C 250 230, 150 280, 150 280 C 150 280, 50 230, 50 160 V 70 Z" fill="#FFFFFF" stroke="#DC2626" stroke-width="2.5" />
          <path d="M 150 200 V 100 M 120 130 L 150 100 L 180 130" fill="none" stroke="#DC2626" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
        </g>
      

  <!-- 极简渐变底边线条 -->
  <rect x="90" y="540" width="1020" height="2" fill="url(#accentGrad_windows_privilege_escalation)" opacity="0.35" rx="1" />

  <!-- 极简 Pill 领域标签 -->
  <g transform="translate(95, 100)">
    <rect x="0" y="0" width="215" height="36" rx="18" fill="#FEE2E2" opacity="0.95" />
    <text x="107.5" y="23" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="800" fill="#B91C1C" letter-spacing="1.5">
      WINDOWS ELEVATION
    </text>
  </g>

  <!-- 右下角 Logo/落款 -->
  <g transform="translate(1100, 580)">
    <text text-anchor="end" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#64748B" letter-spacing="2">
      FLYING THEME · 序栈
    </text>
  </g>
</svg>