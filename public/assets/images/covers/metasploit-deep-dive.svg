<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background-color: #FFF7ED;">
  <defs>
    <linearGradient id="bgGrad_metasploit_deep_dive" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF7ED" />
      <stop offset="50%" stop-color="#FFEDD5" />
      <stop offset="100%" stop-color="#FED7AA" />
    </linearGradient>

    <linearGradient id="accentGrad_metasploit_deep_dive" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#F97316" />
    </linearGradient>

    <pattern id="dotGrid_metasploit_deep_dive" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.2" fill="#94A3B8" opacity="0.22" />
    </pattern>

    <filter id="softGlow_metasploit_deep_dive" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- 背景底图与极简点阵 -->
  <rect width="100%" height="100%" fill="url(#bgGrad_metasploit_deep_dive)" />
  <rect width="100%" height="100%" fill="url(#dotGrid_metasploit_deep_dive)" />

  <!-- 柔和浅色高质感弥散光斑 -->
  <circle cx="960" cy="180" r="320" fill="#FB923C" opacity="0.28" filter="url(#softGlow_metasploit_deep_dive)" />
  <circle cx="280" cy="520" r="260" fill="#FDBA74" opacity="0.22" filter="url(#softGlow_metasploit_deep_dive)" />

  <!-- 主题构图图腾 -->
  
        <g transform="translate(770, 150)" opacity="0.85">
          <circle cx="150" cy="150" r="130" fill="none" stroke="#EA580C" stroke-width="2" />
          <circle cx="150" cy="150" r="90" fill="none" stroke="#EA580C" stroke-width="1.5" stroke-dasharray="6 6" />
          <circle cx="150" cy="150" r="50" fill="none" stroke="#EA580C" stroke-width="2" />
          <circle cx="150" cy="150" r="12" fill="#EA580C" />
          <line x1="150" y1="0" x2="150" y2="300" stroke="#EA580C" stroke-width="1.5" opacity="0.4" />
          <line x1="0" y1="150" x2="300" y2="150" stroke="#EA580C" stroke-width="1.5" opacity="0.4" />
        </g>
      

  <!-- 极简渐变底边线条 -->
  <rect x="90" y="540" width="1020" height="2" fill="url(#accentGrad_metasploit_deep_dive)" opacity="0.35" rx="1" />

  <!-- 文本内容排版 -->
  <g transform="translate(95, 230)">
    <!-- Pill 标签 -->
    <rect x="0" y="0" width="255" height="32" rx="16" fill="#FFEDD5" opacity="0.95" />
    <text x="127.5" y="20.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#C2410C" letter-spacing="1.2">
      EXPLOITATION FRAMEWORK
    </text>

    <!-- 主标题 -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
      Metasploit 框架深度实战
    </text>

    <!-- 副标题 -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="500" fill="#475569" letter-spacing="0.2">
      从漏洞扫描 · payload 构造到获取 Shell
    </text>
  </g>

  <!-- 右下角 Logo/落款 -->
  <g transform="translate(1100, 580)">
    <text text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#64748B" letter-spacing="2">
      FLYING THEME · 序栈
    </text>
  </g>
</svg>