<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="50%" stop-color="#EEF2FF" />
      <stop offset="100%" stop-color="#E0E7FF" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.2" fill="#94A3B8" opacity="0.22" />
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90" result="blur" />
    </filter>
  </defs>

  <!-- 背景底图与极简点阵 -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#dotGrid)" />

  <!-- 柔和浅色高质感弥散光斑 -->
  <circle cx="960" cy="180" r="320" fill="#818CF8" opacity="0.28" filter="url(#softGlow)" />
  <circle cx="280" cy="520" r="260" fill="#C084FC" opacity="0.22" filter="url(#softGlow)" />

  <!-- 主题构图图腾 -->
  
        <g transform="translate(760, 160)" opacity="0.85">
          <circle cx="160" cy="160" r="140" fill="none" stroke="#4F46E5" stroke-width="2" stroke-dasharray="6 6" />
          <circle cx="160" cy="160" r="95" fill="none" stroke="#4F46E5" stroke-width="1.5" opacity="0.4" />
          <circle cx="160" cy="160" r="45" fill="#FFFFFF" stroke="#4F46E5" stroke-width="3" />
          <circle cx="160" cy="160" r="14" fill="#4F46E5" />
          <line x1="160" y1="20" x2="160" y2="300" stroke="#4F46E5" stroke-width="1.5" opacity="0.3" />
          <line x1="20" y1="160" x2="300" y2="160" stroke="#4F46E5" stroke-width="1.5" opacity="0.3" />
          <circle cx="160" cy="20" r="6" fill="#4F46E5" />
          <circle cx="300" cy="160" r="6" fill="#4F46E5" />
          <circle cx="160" cy="300" r="6" fill="#4F46E5" />
          <circle cx="20" cy="160" r="6" fill="#4F46E5" />
        </g>
      

  <!-- 极简渐变底边线条 -->
  <rect x="90" y="540" width="1020" height="2" fill="url(#accentGrad)" opacity="0.35" rx="1" />

  <!-- 文本内容排版 -->
  <g transform="translate(95, 230)">
    <!-- Pill 标签 -->
    <rect x="0" y="0" width="213" height="32" rx="16" fill="#E0E7FF" opacity="0.95" />
    <text x="106.5" y="20.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#4338CA" letter-spacing="1.2">
      AI & DEEP LEARNING
    </text>

    <!-- 主标题 -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
      2026 AI 大模型发展态势
    </text>

    <!-- 副标题 -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="500" fill="#475569" letter-spacing="0.2">
      技术路线 · 开源生态 · 应用落地与趋势对比
    </text>
  </g>

  <!-- 右下角 Logo/落款 -->
  <g transform="translate(1100, 580)">
    <text text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#64748B" letter-spacing="2">
      FLYING THEME · 序栈
    </text>
  </g>
</svg>