<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF5FF" />
      <stop offset="50%" stop-color="#F3E8FF" />
      <stop offset="100%" stop-color="#E9D5FF" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.2" fill="#94A3B8" opacity="0.22" />
    </pattern>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="90" result="blur" />
    </filter>
  </defs>

  <!-- 背景底图与极简点阵 -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#dotGrid)" />

  <!-- 柔和浅色高质感弥散光斑 -->
  <circle cx="960" cy="180" r="320" fill="#C084FC" opacity="0.28" filter="url(#softGlow)" />
  <circle cx="280" cy="520" r="260" fill="#E9D5FF" opacity="0.22" filter="url(#softGlow)" />

  <!-- 主题构图图腾 -->
  
        <g transform="translate(780, 160)" opacity="0.85">
          <path d="M 30 270 L 100 270 L 100 200 L 170 200 L 170 130 L 240 130 L 240 60 L 280 60" fill="none" stroke="#7C3AED" stroke-width="3" stroke-linecap="round" />
          <circle cx="100" cy="270" r="6" fill="#7C3AED" />
          <circle cx="170" cy="200" r="6" fill="#7C3AED" />
          <circle cx="240" cy="130" r="6" fill="#7C3AED" />
          <circle cx="240" cy="60" r="16" fill="#FFFFFF" stroke="#7C3AED" stroke-width="3" />
          <polygon points="240,50 248,67 232,67" fill="#7C3AED" />
        </g>
      

  <!-- 极简渐变底边线条 -->
  <rect x="90" y="540" width="1020" height="2" fill="url(#accentGrad)" opacity="0.35" rx="1" />

  <!-- 文本内容排版 -->
  <g transform="translate(95, 230)">
    <!-- Pill 标签 -->
    <rect x="0" y="0" width="234" height="32" rx="16" fill="#EDE9FE" opacity="0.95" />
    <text x="117" y="20.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#6D28D9" letter-spacing="1.2">
      PRIVILEGE ESCALATION
    </text>

    <!-- 主标题 -->
    <text x="0" y="85" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
      Linux 提权技术详解
    </text>

    <!-- 副标题 -->
    <text x="0" y="132" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="500" fill="#475569" letter-spacing="0.2">
      SUID 提权 · 内核漏洞利用与 Cron 劫持
    </text>
  </g>

  <!-- 右下角 Logo/落款 -->
  <g transform="translate(1100, 580)">
    <text text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600" fill="#64748B" letter-spacing="2">
      FLYING THEME · 序栈
    </text>
  </g>
</svg>