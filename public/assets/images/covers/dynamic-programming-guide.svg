<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 675" width="1200" height="675" style="background-color: #FAFAF9;">
  <defs>
    <linearGradient id="bgGrad_dynamic_programming_guide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAFAF9" />
      <stop offset="50%" stop-color="#FFFBEB" />
      <stop offset="100%" stop-color="#FEF3C7" />
    </linearGradient>

    <linearGradient id="accentGrad_dynamic_programming_guide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <pattern id="dotGrid_dynamic_programming_guide" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="1.2" fill="#94A3B8" opacity="0.22" />
    </pattern>

    <radialGradient id="glow1_dynamic_programming_guide" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glow2_dynamic_programming_guide" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FCD34D" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FCD34D" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- 背景底图与极简点阵 -->
  <rect width="100%" height="100%" fill="url(#bgGrad_dynamic_programming_guide)" />
  <rect width="100%" height="100%" fill="url(#dotGrid_dynamic_programming_guide)" />

  <!-- 柔和浅色高质感弥散光斑 -->
  <circle cx="960" cy="180" r="380" fill="url(#glow1_dynamic_programming_guide)" />
  <circle cx="280" cy="520" r="320" fill="url(#glow2_dynamic_programming_guide)" />

  <!-- 主题构图图腾 -->
  
        <g transform="translate(770, 160)" opacity="0.85">
          <rect x="30" y="30" width="260" height="260" rx="16" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="8 8" />
          <rect x="60" y="60" width="60" height="60" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="2" />
          <rect x="140" y="60" width="60" height="60" rx="8" fill="#D97706" opacity="0.15" />
          <rect x="220" y="60" width="40" height="60" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" />
          <rect x="60" y="140" width="60" height="60" rx="8" fill="#D97706" opacity="0.15" />
          <rect x="140" y="140" width="60" height="60" rx="8" fill="#D97706" />
          <rect x="220" y="140" width="40" height="60" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" />
          <rect x="60" y="220" width="60" height="40" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" />
          <rect x="140" y="220" width="60" height="40" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="1.5" />
          <rect x="220" y="220" width="40" height="40" rx="8" fill="#D97706" opacity="0.2" />
        </g>
      

  <!-- 极简渐变底边线条 -->
  <rect x="90" y="540" width="1020" height="2" fill="url(#accentGrad_dynamic_programming_guide)" opacity="0.35" rx="1" />

  <!-- 文本内容排版 -->
  <g transform="translate(95, 230)">
    <!-- Pill 标签 -->
    <rect x="0" y="0" width="202.5" height="32" rx="16" fill="#FEF3C7" opacity="0.95" />
    <text x="101.25" y="20.5" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="12" font-weight="800" fill="#B45309" letter-spacing="1.2">
      ALGORITHMS &amp; MATH
    </text>

    <!-- 主标题 -->
    <text x="0" y="85" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="42" font-weight="800" fill="#0F172A" letter-spacing="-0.5">
      动态规划从入门到精通
    </text>

    <!-- 副标题 -->
    <text x="0" y="132" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="500" fill="#475569" letter-spacing="0.2">
      状态转移方程 · 边界条件与经典模型解构
    </text>
  </g>

  <!-- 右下角 Logo/落款 -->
  <g transform="translate(1100, 580)">
    <text text-anchor="end" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="15" font-weight="600" fill="#64748B" letter-spacing="2">
      FLYING THEME · 序栈
    </text>
  </g>
</svg>