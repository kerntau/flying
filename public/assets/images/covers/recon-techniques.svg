<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#042f2e" />
      <stop offset="100%" stop-color="#134e4a" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- 背景底图与网格纹理 -->
  <rect width="100%" height="100%" fill="url(#bgGrad)" />
  <rect width="100%" height="100%" fill="url(#grid)" />

  <!-- 科技半透明发光光束 -->
  <circle cx="950" cy="150" r="340" fill="#14b8a6" opacity="0.35" filter="url(#glow)" />
  <circle cx="250" cy="500" r="280" fill="#10b981" opacity="0.25" filter="url(#glow)" />

  <!-- 背景艺术构图几何线条 -->
  <g opacity="0.18" transform="translate(620, 70)">
    <rect x="0" y="0" width="440" height="440" rx="36" fill="none" stroke="#14b8a6" stroke-width="4" transform="rotate(15 220 220)"/>
    <circle cx="220" cy="220" r="160" fill="none" stroke="#10b981" stroke-width="3" stroke-dasharray="14 14" />
    <circle cx="220" cy="220" r="90" fill="#14b8a6" opacity="0.6" />
  </g>

  <!-- 底部渐变分割线 -->
  <rect x="90" y="560" width="1020" height="2" fill="url(#accentGrad)" opacity="0.8" />

  <!-- 右下角落款 -->
  <g transform="translate(1110, 605)">
    <text text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600" fill="rgba(255, 255, 255, 0.45)" letter-spacing="2">
      FLYING THEME · 序栈
    </text>
  </g>
</svg>